<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- Smartphone Body Outer -->
  <rect x="40" y="24" width="48" height="80" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smartphone Screen Fill -->
  <rect x="46" y="34" width="36" height="56" rx="4" ry="4" fill="url(#screenGrad)" />

  <!-- Speaker Bar Top -->
  <line x1="56" y1="29" x2="72" y2="29" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Home Button / Fingerprint Dot Bottom -->
  <circle cx="64" cy="96" r="3.5" fill="#ffffff" />

  <!-- Signal / Pulse Wave Accent Top Right -->
  <path d="M96 32 C104 40, 104 52, 96 60" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <path d="M104 24 C116 36, 116 56, 104 68" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />
</svg>

